[package]
name = "callback-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Flat, compile-time-checked callback_data (de)serialization for Telegram bots, aiogram-CallbackData-style"
license.workspace = true

[workspace]
resolver = "3"
members = ["derive"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.90"
license = "Unlicense"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
telers = { version = "1.0.0-beta.10", default-features = false }

[dependencies]
callback-data-derive = { path = "derive" }

# only for the `merge` feature (fields!/merge/merge_to via serde_json)
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
serde_json = { version = "1.0", default-features = false, optional = true }

# only for the `telers` feature
telers = { workspace = true, optional = true }

base62 = { version = "2", default-features = false, features = ["alloc"] }
chrono = { workspace = true, optional = true }
thiserror = { version = "2.0", default-features = false }

[dev-dependencies]
chrono.workspace = true
telers = { workspace = true, features = ["serde"] }

[features]
default = []
chrono = ["dep:chrono"]
merge = ["dep:serde", "dep:serde_json"]
telers = ["dep:telers"]
